steps:
  # Step 0: Compile the Go binary
  - name: 'gcr.io/cloud-builders/go'
    dir: 'gke-devops-workflows-challenge'
    args: ['build', '-o', 'main', 'main.go']

  # Step 2: Build the Docker image for the Go application
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-west4-docker.pkg.dev/$PROJECT_ID/my-repository/sample-app:v1.0', '.']

  # Step 3: Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-west4-docker.pkg.dev/$PROJECT_ID/my-repository/sample-app:v1.0']

  # Step 4: Apply the production deployment YAML file to the production namespace
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'Deploy'
    args: ['apply', '-f', 'gke-devops-workflows-challenge/dev/', '-n', 'dev']
    env:
    - 'CLOUDSDK_COMPUTE_REGION=us-west4-a'
    - 'CLOUDSDK_CONTAINER_CLUSTER=hello-cluster'
options:
 logging: CLOUD_LOGGING_ONLY