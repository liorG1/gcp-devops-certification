steps:
# Step 0: Build the Go binary
- name: 'gcr.io/cloud-builders/go'
  args: ['build', '-o', 'main', 'main.go']
 

# Step 1: Build the Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-west4-docker.pkg.dev/terraform-learning-503012/my-repository/hello-cloudbuild-dev:v3.0', '.']
 

# Step 2: Push the Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-west4-docker.pkg.dev/terraform-learning-503012/my-repository/hello-cloudbuild-dev:v3.0']
 

# Step 3: Deploy to Kubernetes GKE
- name: 'gcr.io/cloud-builders/kubectl'
  args: ['apply', '-f', 'dev/deployment.yaml', '-n', 'dev']
 
  env:
  - 'CLOUDSDK_COMPUTE_ZONE=us-west4-b'
  - 'CLOUDSDK_CONTAINER_CLUSTER=hello-cluster'